name: CLI

on:
  pull_request:
  workflow_dispatch:
    inputs:
      base_sha:
        description: "Main commit selected before preparing the app release candidate"
        required: true
        type: string
  push:
    branches: [main]
    paths:
      - "cli/**"
      - "worker/**"
      - "src/data/**"
      - "bun.lock"
      - ".github/workflows/cli.yml"
      - ".github/workflows/cli-release.yml"

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: bun run typecheck
      - run: bun run test
      - run: bun run check:package

  changeset:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"
      - run: bun install --frozen-lockfile
      - name: Require a CLI changeset for packaged behavior
        shell: bash
        env:
          CANDIDATE_BASE: ${{ inputs.base_sha }}
          PUSH_BASE: ${{ github.event.before }}
        run: |
          case "$GITHUB_EVENT_NAME" in
            pull_request) base="origin/$GITHUB_BASE_REF" ;;
            push) base="$PUSH_BASE" ;;
            workflow_dispatch)
              base="$CANDIDATE_BASE"
              [[ "$base" =~ ^[0-9a-f]{40}$ ]]
              git fetch --no-tags origin main:refs/remotes/origin/main
              git merge-base --is-ancestor "$base" origin/main
              # No news leaves HEAD at the selected base. Otherwise the app
              # release must be exactly one non-merge commit atop that base.
              if [ "$(git rev-parse HEAD)" != "$base" ]; then
                test "$(git show -s --format=%P HEAD)" = "$base"
              fi
              ;;
            *) exit 1 ;;
          esac
          bun run check:changeset "$base"
