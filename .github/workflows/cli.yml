name: CLI

on:
  pull_request:
    paths:
      - "cli/**"
      - "worker/**"
      - "src/data/**"
      - "bun.lock"
      - ".github/workflows/cli.yml"
      - ".github/workflows/cli-release.yml"
  push:
    branches: [main]
    paths:
      - "cli/**"
      - "worker/**"
      - "src/data/**"
      - "bun.lock"
      - ".github/workflows/cli.yml"
      - ".github/workflows/cli-release.yml"

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: bun run typecheck
      - run: bun run test
      - run: bun run check:package

  changeset:
    if: github.event_name == 'pull_request' && !startsWith(github.head_ref, 'changeset-release/')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"
      - run: bun install --frozen-lockfile
      - name: Require a CLI changeset for packaged behavior
        run: bun run check:changeset "origin/${GITHUB_BASE_REF}"
