name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
    inputs:
      ref:
        description: Exact commit selected for deployment
        required: true
        type: string

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          # `changeset status --since` diffs against the base branch, so the
          # shallow default clone isn't enough.
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"
      - run: bun install --frozen-lockfile
      - name: Format check
        run: bun run fmt:check
      - name: Lint
        run: bun run lint
      - name: Typecheck
        run: bun run typecheck
      - name: Typecheck worker
        run: bun run typecheck:worker
      - name: Typecheck tests
        run: bun run typecheck:test
      - name: Unit tests
        run: bun run test
      - name: Release automation tests
        run: |
          bunx --no-install oxlint scripts/release.ts scripts/release.test.ts scripts/shortcut.ts scripts/shortcut.test.ts
          bun test scripts/release.test.ts
          bun test scripts/shortcut.test.ts
      # AGENTS.md states gotchas inline and points at docs/ + docs/adr/ for the
      # rest. That trade is only safe while every pointer resolves: an agent
      # reads a miss, shrugs, and proceeds without the constraint it was meant
      # to load. Enforced here rather than remembered.
      - name: Doc pointers
        run: bun run check:docs
      # Every PR discloses what it changed, or says out loud that it changed
      # nothing worth telling anyone (`bunx changeset --empty`). A version bump
      # nobody trusts is worse than no version at all -- ADR 0046.
      - name: Changeset present
        if: github.event_name == 'pull_request'
        run: |
          git fetch --no-tags --depth=1 origin "$GITHUB_BASE_REF"
          bunx changeset status --since="origin/$GITHUB_BASE_REF"
