name: CI

on:
  # Main is checked through deploy.yml's exact-commit workflow_call. A second
  # push trigger would duplicate the entire browser regression on each merge.
  pull_request:
  workflow_call:
    inputs:
      ref:
        description: Exact commit selected for deployment
        required: true
        type: string

permissions:
  contents: read

# Only superseded PR validation is disposable. A reusable production call uses
# its caller's run ID and must never cancel the parent deployment or another run.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          # `changeset status --since` diffs against the base branch, so the
          # shallow default clone isn't enough. It compares paths, not file
          # contents, so history arrives without its blobs.
          fetch-depth: 0
          filter: blob:none
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"
      - run: bun install --frozen-lockfile
      - name: Format check
        run: bun run fmt:check
      - name: Lint
        run: bun run lint
      - name: Typecheck
        run: bun run typecheck
      - name: Typecheck worker
        run: bun run typecheck:worker
      - name: Typecheck tests
        run: bun run typecheck:test
      - name: Typecheck app e2e
        run: bun run typecheck:e2e
      - name: Unit tests
        run: bun run test
      - name: Release automation tests
        run: |
          bunx --no-install oxlint scripts/release.ts scripts/release.test.ts scripts/shortcut.ts scripts/shortcut.test.ts scripts/heavy-lane.ts scripts/heavy-lane.test.ts scripts/e2e-shards.ts scripts/e2e-shards.test.ts scripts/cf-dev.ts
          bun test scripts/release.test.ts
          bun test scripts/shortcut.test.ts
          bun test scripts/heavy-lane.test.ts
          bun test scripts/e2e-shards.test.ts
      # AGENTS.md states gotchas inline and points at docs/ + docs/adr/ for the
      # rest. That trade is only safe while every pointer resolves: an agent
      # reads a miss, shrugs, and proceeds without the constraint it was meant
      # to load. Enforced here rather than remembered.
      - name: Doc pointers
        run: bun run check:docs
      # The app suite runs as lanes on separate runners. A Playwright project
      # that matches no lane would stop running without failing anything.
      - name: App browser lanes cover every test
        run: bun run check:e2e-lanes
      # Every PR discloses what it changed, or says out loud that it changed
      # nothing worth telling anyone (`bunx changeset --empty`). A version bump
      # nobody trusts is worse than no version at all -- ADR 0046.
      - name: Changeset present
        if: github.event_name == 'pull_request'
        run: |
          git fetch --no-tags origin "$GITHUB_BASE_REF"
          bun run check:changeset

  worker:
    # The real-Worker browser suite needs nothing from checks. Its own runner
    # keeps a browser install and a Miniflare run off the nonbrowser lane.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"
      - run: bun install --frozen-lockfile
      - name: Install Worker browser
        run: |
          # Use the same mirror workaround as the app shards below.
          sudo sed -i '/azure\.archive\.ubuntu\.com/d' /etc/apt/apt-mirrors.txt
          bunx playwright install --with-deps chromium
      - name: Real Worker browser persistence
        run: bun run test:e2e:worker-browser
      - name: Upload Worker failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: real-worker-failures
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

  app:
    # Independent runners need no output from checks. The quality gate below
    # still requires every lane, including failed or skipped prerequisites.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      # Finish other shards so one failure does not hide independent failures.
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"
      - run: bun install --frozen-lockfile
      - name: Install Chromium
        run: |
          # Slow Azure mirror downloads can exhaust the job before tests start.
          # https://github.com/actions/runner-images/issues/14823
          sudo sed -i '/azure\.archive\.ubuntu\.com/d' /etc/apt/apt-mirrors.txt
          # These shards run headless Chromium only. WebKit's 185 system
          # packages install once, in the app-webkit job.
          bunx playwright install --with-deps --only-shell chromium
      # Two workers: the runner has four cores, and the bundle's static server
      # is no longer a shared bottleneck the way the development server was.
      - name: App browser regression
        # Shards are filled by recorded time, not test count. The file list is
        # its own statement so a failure stops the step: with no file arguments
        # Playwright would run the whole project.
        run: |
          files=$(bun scripts/e2e-shards.ts files ${{ matrix.shard }} ${{ strategy.job-total }})
          bun run test:e2e:app:chromium $files --workers=2 --retries=0 --max-failures=1 --trace=retain-on-failure --reporter=github,json
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: test-results/results.json
      - name: Upload browser timings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-test-timings-${{ matrix.shard }}
          path: test-results/results.json
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload failure traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-failure-traces-${{ matrix.shard }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

  app-webkit:
    # Every WebKit project, on the two runners that install WebKit.
    # `check:e2e-lanes` proves this lane and the Chromium shards together run
    # each app test exactly once. Playwright's `--shard` splits the lane in two.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # Not named `shard`: `check:e2e-lanes` reads the Chromium matrix by that name.
        webkit_shard: [1, 2]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"
      - run: bun install --frozen-lockfile
      - name: Install WebKit
        run: |
          sudo sed -i '/azure\.archive\.ubuntu\.com/d' /etc/apt/apt-mirrors.txt
          bunx playwright install --with-deps webkit
      # One worker. Two workers have five green runs here; raising it is its
      # own measured change. The one failure seen at two was the editor race
      # that ADR 0010 now records, which also failed at one worker.
      - name: App browser regression
        run: bun run test:e2e:app:webkit --shard=${{ matrix.webkit_shard }}/${{ strategy.job-total }} --workers=1 --retries=0 --max-failures=1 --trace=retain-on-failure --reporter=github,json
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: test-results/results.json
      - name: Upload browser timings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-test-timings-webkit-${{ matrix.webkit_shard }}
          path: test-results/results.json
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload failure traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-failure-traces-webkit-${{ matrix.webkit_shard }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

  # Preserve the existing required check name. A skipped or failed prerequisite
  # must fail this gate, including when deployment calls the workflow.
  quality:
    if: always()
    needs: [checks, worker, app, app-webkit]
    runs-on: ubuntu-latest
    steps:
      - name: Require every check and browser shard
        run: |
          test "${{ needs.checks.result }}" = success
          test "${{ needs.worker.result }}" = success
          test "${{ needs.app.result }}" = success
          test "${{ needs.app-webkit.result }}" = success
